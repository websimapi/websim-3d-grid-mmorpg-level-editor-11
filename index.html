    <button id="toggle-right-menu" class="menu-hidden">

        <path d="M15 18l-6-6 6-6"/>

    <div id="mobile-rotation-control" style="position: fixed; bottom: 20px; right: 20px; width: 80px; height: 80px; background: rgba(0,0,0,0.5); border-radius: 50%; border: 2px solid #666; z-index: 1001; display: none; cursor: grab;">
